version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cert-verify-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cert-verify
    networks:
      - cert-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cert-verify-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cert-verify
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production_please}
      - JWT_EXPIRE=7d
      - ADMIN_REGISTRATION_CODE=${ADMIN_REGISTRATION_CODE:-ADMIN2024SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - cert-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    container_name: cert-verify-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cert-network

volumes:
  mongo_data:
  uploads_data:

networks:
  cert-network:
    driver: bridge
